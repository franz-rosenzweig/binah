# XcodeGen spec. Generates Binah.xcodeproj from this file plus the Swift sources,
# so the project is reviewable text in git instead of an opaque bundle.
#   brew install xcodegen && xcodegen generate && open Binah.xcodeproj
# build.sh reads the same settings and builds without Xcode.
name: Binah
options:
  bundleIdPrefix: xyz.tiresia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Binah:
    type: application
    platform: macOS
    # a shared scheme, so `xcodebuild -scheme Binah` and the Run button agree
    scheme:
      configVariants: []
    sources:
      - path: Binah
    settings:
      base:
        PRODUCT_NAME: Binah
        PRODUCT_BUNDLE_IDENTIFIER: xyz.tiresia.binah
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        # Signing to run on this Mac is enough; no team in this public repo.
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Binah/Info.plist
      properties:
        CFBundleName: Binah
        CFBundleDisplayName: Binah
        # XcodeGen otherwise writes 1.0 and 1, whatever the settings above say
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        # Just a Minute and the benchmark talk record in the page (docs/SHELL.md §2).
        NSMicrophoneUsageDescription: Binah records your spoken answers and sends them to your Binah server to be transcribed.
        # binah://go/today (docs/SHELL.md §8)
        CFBundleURLTypes:
          - CFBundleURLName: xyz.tiresia.binah
            CFBundleURLSchemes: [binah]
        # Services → Train on This in Binah: selected text or a link from any app (TrainOnThis.swift)
        NSServices:
          - NSMessage: trainOnThis
            NSPortName: Binah
            NSMenuItem:
              default: Train on This in Binah
            NSSendTypes: [public.utf8-plain-text, public.url]
            NSRequiredContext: {}
        # A sandbox on the tailnet is plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Binah/Binah.entitlements
      properties:
        # Sandbox off, as Daf and Moshe: a window on one site, nothing else on this Mac.
        com.apple.security.app-sandbox: false
        # The hardened runtime lets the microphone through only with this.
        com.apple.security.device.audio-input: true
